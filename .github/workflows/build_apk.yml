name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      # Repo không cần commit thư mục android/, CI tự sinh ra
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name inventory_scanner --org vn.kiemkho .

      - name: Patch AndroidManifest (quyen camera + ten app)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="Kiểm kho"#' $M
          grep -n "CAMERA\|label" $M
      - name: Patch Gradle (minSdk 23 + NDK 27)
        run: |
          G=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          echo "Patching $G"
          sed -i 's/minSdk *= *flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion *flutter.minSdkVersion/minSdkVersion 23/' $G
          sed -i 's/ndkVersion *= *flutter.ndkVersion/ndkVersion = "27.0.12077973"/; s/ndkVersion *flutter.ndkVersion/ndkVersion "27.0.12077973"/' $G
          grep -n "minSdk\|ndkVersion" $G
      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiem-kho-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to GitHub Release (khi push tag vX.Y)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
